[package]
name = "xiaomeng-zhijuan"
version = "0.3.0"
description = "小梦织卷 — AI 小说续写桌面客户端"
authors = ["xiaomeng"]
edition = "2021"

[lib]
name = "xiaomeng_zhijuan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-haptics = "2"
# unsafe-headers：允许 JS 侧传空 Origin 头，插件会在 Rust 侧移除该头。
# 部分模型中转站对带陌生 Origin 的 POST 一律按 CSRF 拒绝（403 CSRF_INVALID），
# 必须能去掉 tauri.localhost 来源才能用（见 src/provider/openai.ts）。
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures = "0.3"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
